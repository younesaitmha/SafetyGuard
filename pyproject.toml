[project]
name = "SafetyGuard"
version = "0.1.0"
description = "Security-first FastAPI gateway for LLM, RAG, and agent workflows with policy, DLP, retrieval, tool, and output guardrails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework & server
    "fastapi==0.136.0",
    "uvicorn[standard]==0.45.0",

    # HTTP client
    "httpx==0.28.1",

    # Data validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",

    # Authentication
    "python-jose[cryptography]==3.3.0",

    # LLM / AI
    "langchain==1.3.9",
    "langchain-openai==1.1.16",
]

[dependency-groups]
dev = [
    # Testing
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
override-dependencies = ["numpy>=2.0.0"]
